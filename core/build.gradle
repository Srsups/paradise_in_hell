[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'
sourceSets.main.resources.srcDirs = ['assets']
// Preserve the old placeholders locally, but do not ship them in the demo.
sourceSets.main.resources.exclude('spritesheet.png', 'button_spritesheet.png', 'Foto_BG.jpg')

test {
  useJUnitPlatform()
}

tasks.register('balanceBaseline', JavaExec) {
  group = 'verification'
  description = 'Exports controlled class and horde baselines without graphics or save writes.'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'br.com.srsups.paradiseinhell.BalanceBaseline'
  args rootProject.layout.buildDirectory.dir('balance-baseline').get().asFile.absolutePath
  if (project.hasProperty('balanceHistoryFile')) args project.property('balanceHistoryFile')
}

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}
